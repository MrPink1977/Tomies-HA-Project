services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - C:/AI_Projects/ha_knowledge_base/chroma_db:/knowledge_base:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    # privileged: true  # Comment out; re-enable only if hardware access breaks
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto  # Wait for MQTT

  freya-visualizer:
    container_name: freya-visualizer
    build:
      context: ./freya-visualizer
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - TZ=America/New_York
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI4MjcxYzMzM2Q1NTk0ODA1YjQ1YTQxM2U1ZjEwOTJlNSIsImlhdCI6MTc3MjQzMzUwMywiZXhwIjoyMDg3NzkzNTAzfQ.cxWfPAjDx2d9D_GNO_RjDtqjir2giySVPydz6Miwj0Q
      - MEDIA_PLAYER_ENTITY=media_player.home_assistant_voice_0a52fa_media_player
    networks:
      - ha_network
    depends_on:
      - homeassistant

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ha_network

  wyoming-whisper:
    container_name: wyoming-whisper
    image: rhasspy/wyoming-whisper:latest
    volumes:
      - ./whisper_data:/data
    ports:
      - "10300:10300"
    command: --model base --language en
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto

  wyoming-piper:
    container_name: wyoming-piper
    image: rhasspy/wyoming-piper:latest
    volumes:
      - ./piper_data:/data
    ports:
      - "10200:10200"
    command: --voice en_US-lessac-medium
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto

  wyoming-openwakeword:
    container_name: wyoming-openwakeword
    image: rhasspy/wyoming-openwakeword:latest
    volumes:
      - ./openwakeword_data:/data
      - ./config/custom_wakewords:/custom
    ports:
      - "10400:10400"
    command: --preload-model hey_freya --custom-model-dir /custom
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh:ro
    ports:
      - "11434:11434"
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - ha_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chromadb:
    container_name: chromadb
    image: chromadb/chroma:latest
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_PERSIST_PATH=/chroma/chroma
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - ha_network

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:latest
    volumes:
      - ./esphome:/config
    ports:
      - "6052:6052"
    restart: unless-stopped
    networks:
      - ha_network

  aircon:
    image: deiger/aircon
    container_name: aircon
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/options.json:/data/options.json
      - ./config:/data
    environment:
      - CONFIG_DIR=/data
    networks:
      - ha_network
    depends_on:
      - mosquitto

  # ── SearXNG ─────────────────────────────────────────────────
  # Shared search backend for LDR (deep reports) and llm_intents (quick voice lookups)
  # Host: http://localhost:8088  |  Docker-internal: http://searxng:8080
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    restart: unless-stopped

  # ── Local Deep Research ──────────────────────────────────────
  # Iterative research engine: search → summarize → find gaps → re-search × N cycles
  # Web UI: http://localhost:5000
  local-deep-research:
    image: localdeepresearch/local-deep-research:latest
    container_name: local-deep-research
    ports:
      - "5000:5000"
    volumes:
      - ./ldr_data:/data
    environment:
      - TZ=America/New_York
      - LDR_DATA_DIR=/data
      - LDR_LLM_PROVIDER=ollama
      - LDR_LLM_OLLAMA_URL=http://ollama:11434
      - LDR_LLM_MODEL=qwen3:8b
      - LDR_SEARCH_ENGINE=searxng
      - LDR_SEARCH_SEARXNG_URL=http://searxng:8080
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng

  # ── Research Bridge ──────────────────────────────────────────
  # Glue layer: HA fires it → authenticates to LDR → polls for completion
  # → converts report to PDF → saves to /config/www/reports/ → calls HA webhook
  # Host: http://localhost:8099
  research-bridge:
    build:
      context: ./research-bridge
    container_name: research-bridge
    ports:
      - "8099:8099"
    volumes:
      - ./config/www/reports:/app/reports
    environment:
      - TZ=America/New_York
      - LDR_URL=http://local-deep-research:5000
      - LDR_USERNAME=admin
      - LDR_PASSWORD=freyaresearch2026
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI4MjcxYzMzM2Q1NTk0ODA1YjQ1YTQxM2U1ZjEwOTJlNSIsImlhdCI6MTc3MjQzMzUwMywiZXhwIjoyMDg3NzkzNTAzfQ.cxWfPAjDx2d9D_GNO_RjDtqjir2giySVPydz6Miwj0Q
      - HA_WEBHOOK_ID=research_report_done
      - GMAIL_USER=tomie.pearson@gmail.com
      - GMAIL_APP_PASS=prrcwiwwwtkfsbsb
      - GMAIL_TO=tomie.pearson@gmail.com
      - CHROMADB_URL=http://chromadb:8000
      - OLLAMA_URL=http://ollama:11434
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - local-deep-research
      - homeassistant

  # ── LiteLLM ─────────────────────────────────────────────────
  # Unified model proxy — sits in front of Ollama and exposes named model
  # endpoints (freya-main, freya-reasoning, freya-fast, freya-vision)
  # OpenAI-compatible API at http://localhost:4000
  # Open WebUI points here instead of directly at Ollama
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama

  # ── Open WebUI ───────────────────────────────────────────────
  # Unified AI workspace — model manager, pipeline router, RAG UI, personas
  # Connects to LiteLLM proxy for named model routing
  # Web UI: http://localhost:3000
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - TZ=America/New_York
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=freya-litellm-key
      - WEBUI_SECRET_KEY=freyaopenwebui2026
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=admin
      - WEBUI_NAME=Freya AI
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama
      - litellm

networks:
  ha_network:
    driver: bridge
