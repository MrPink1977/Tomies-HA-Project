services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - C:/AI_Projects/ha_knowledge_base/chroma_db:/knowledge_base:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    # privileged: true  # Comment out; re-enable only if hardware access breaks
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto  # Wait for MQTT

  freya-visualizer:
    container_name: freya-visualizer
    build:
      context: ./freya-visualizer
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - TZ=America/New_York
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=${HA_TOKEN}
      - MEDIA_PLAYER_ENTITY=media_player.home_assistant_voice_0a52fa_media_player
    networks:
      - ha_network
    depends_on:
      - homeassistant

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - ha_network

  wyoming-whisper:
    container_name: wyoming-whisper
    image: rhasspy/wyoming-whisper:latest
    volumes:
      - ./whisper_data:/data
    ports:
      - "10300:10300"
    command: --model base --language en
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto

  wyoming-piper:
    container_name: wyoming-piper
    image: rhasspy/wyoming-piper:latest
    volumes:
      - ./piper_data:/data
    ports:
      - "10200:10200"
    command: --voice en_US-lessac-medium
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh:ro
    ports:
      - "11434:11434"
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - ha_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "/ollama-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chromadb:
    container_name: chromadb
    image: chromadb/chroma:latest
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_PERSIST_PATH=/chroma/chroma
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - ha_network

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:latest
    volumes:
      - ./esphome:/config
    ports:
      - "6052:6052"
    restart: unless-stopped
    networks:
      - ha_network

  aircon:
    image: deiger/aircon
    container_name: aircon
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/options.json:/data/options.json
      - ./config:/data
    environment:
      - CONFIG_DIR=/data
    networks:
      - ha_network
    depends_on:
      - mosquitto

  # ── SearXNG ─────────────────────────────────────────────────
  # Shared search backend for LDR (deep reports) and llm_intents (quick voice lookups)
  # Host: http://localhost:8088  |  Docker-internal: http://searxng:8080
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    restart: unless-stopped

  # ── Local Deep Research ──────────────────────────────────────
  # Iterative research engine: search → summarize → find gaps → re-search × N cycles
  # Web UI: http://localhost:5000
  local-deep-research:
    image: localdeepresearch/local-deep-research:latest
    container_name: local-deep-research
    ports:
      - "5000:5000"
    volumes:
      - ./ldr_data:/data
    environment:
      - TZ=America/New_York
      - LDR_DATA_DIR=/data
      - LDR_LLM_PROVIDER=ollama
      - LDR_LLM_OLLAMA_URL=http://ollama:11434
      - LDR_LLM_MODEL=qwen3:8b
      - LDR_SEARCH_ENGINE=searxng
      - LDR_SEARCH_SEARXNG_URL=http://searxng:8080
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng

  # ── Research Bridge ──────────────────────────────────────────
  # Glue layer: HA fires it → authenticates to LDR → polls for completion
  # → converts report to PDF → saves to /config/www/reports/ → calls HA webhook
  # Host: http://localhost:8099
  research-bridge:
    build:
      context: ./research-bridge
    container_name: research-bridge
    ports:
      - "8099:8099"
    volumes:
      - ./config/www/reports:/app/reports
    environment:
      - TZ=America/New_York
      - LDR_URL=http://local-deep-research:5000
      - LDR_USERNAME=admin
      - LDR_PASSWORD=${LDR_PASSWORD}
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=${HA_TOKEN}
      - HA_WEBHOOK_ID=${HA_WEBHOOK_ID}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASS=${GMAIL_APP_PASS}
      - GMAIL_TO=${GMAIL_TO}
      - CHROMADB_URL=http://chromadb:8000
      - OLLAMA_URL=http://ollama:11434
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - local-deep-research
      - homeassistant

  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    privileged: true
    shm_size: "256mb"
    restart: unless-stopped
    ports:
      - "8971:8971"
      - "5001:5000"
      - "8556:8554"
      - "8557:8555/tcp"
      - "8557:8555/udp"
    volumes:
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/New_York
      - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER:?Set FRIGATE_RTSP_USER in .env}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:?Set FRIGATE_RTSP_PASSWORD in .env}
    networks:
      - ha_network
    depends_on:
      - mosquitto

  double-take:
    container_name: double-take
    image: jakowenko/double-take:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./double-take:/.storage
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    depends_on:
      - mosquitto
      - frigate
      - compreface-ui

  compreface-postgres-db:
    container_name: compreface-postgres-db
    image: exadel/compreface-postgres-db:1.2.0
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=frs
    volumes:
      - ./compreface/postgres-data:/var/lib/postgresql/data
    networks:
      - ha_network

  compreface-admin:
    container_name: compreface-admin
    image: exadel/compreface-admin:1.2.0
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=false
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USERNAME=
      - EMAIL_FROM=
      - EMAIL_PASSWORD=
      - ADMIN_JAVA_OPTS=-Xmx1g
      - MAX_FILE_SIZE=5MB
      - MAX_REQUEST_SIZE=10MB
    networks:
      - ha_network
    depends_on:
      - compreface-postgres-db
      - compreface-api

  compreface-api:
    container_name: compreface-api
    image: exadel/compreface-api:1.2.0
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - API_JAVA_OPTS=-Xmx4g
      - SAVE_IMAGES_TO_DB=true
      - MAX_FILE_SIZE=5MB
      - MAX_REQUEST_SIZE=10MB
      - CONNECTION_TIMEOUT=10000
      - READ_TIMEOUT=60000
    networks:
      - ha_network
    depends_on:
      - compreface-postgres-db

  compreface-ui:
    container_name: compreface-ui
    image: exadel/compreface-fe:1.2.0
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - CLIENT_MAX_BODY_SIZE=10M
      - PROXY_READ_TIMEOUT=60000ms
      - PROXY_CONNECT_TIMEOUT=10000ms
    networks:
      - ha_network
    depends_on:
      - compreface-api
      - compreface-admin

  compreface-core:
    container_name: compreface-core
    image: exadel/compreface-core:1.2.0
    restart: unless-stopped
    environment:
      - ML_PORT=3000
      - IMG_LENGTH_LIMIT=640
      - UWSGI_PROCESSES=2
      - UWSGI_THREADS=1
    networks:
      - ha_network

  # ── LiteLLM ─────────────────────────────────────────────────
  # Unified model proxy — sits in front of Ollama and exposes named model
  # endpoints (freya-main, freya-reasoning, freya-fast, freya-vision)
  # OpenAI-compatible API at http://localhost:4000
  # Open WebUI points here instead of directly at Ollama
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    environment:
      - TZ=America/New_York
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama

  # ── Open WebUI ───────────────────────────────────────────────
  # Unified AI workspace — model manager, pipeline router, RAG UI, personas
  # Connects to LiteLLM proxy for named model routing
  # Web UI: http://localhost:3000
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - TZ=America/New_York
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=admin
      - WEBUI_NAME=Freya AI
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - ollama
      - litellm

  # Open WebUI Pipelines plugin server
  # Open WebUI connection URL from inside Docker: http://pipelines:9099
  # Default API key: 0p3n-w3bu! unless PIPELINES_API_KEY is set in .env
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./openwebui_pipelines:/app/pipelines
      - ./config/freya_entity_aliases.yaml:/app/freya_entity_aliases.yaml:ro
    environment:
      - TZ=America/New_York
      - PIPELINES_API_KEY=${PIPELINES_API_KEY:-0p3n-w3bu!}
      - HOME_ASSISTANT_URL=http://homeassistant:8123
      - HOME_ASSISTANT_TOKEN=${HA_TOKEN}
      - ENTITY_ALIASES_PATH=/app/freya_entity_aliases.yaml
      - DRY_RUN=true
    networks:
      - ha_network
    restart: unless-stopped
    depends_on:
      - homeassistant

networks:
  ha_network:
    driver: bridge
