esphome:
  name: myvoiceassistant
  friendly_name: MyVoiceAssistant

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret myvoiceassistant_api_encryption_key

ota:
  - platform: esphome
    password: !secret myvoiceassistant_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Myvoiceassistant"
    password: !secret myvoiceassistant_fallback_password

captive_portal:
    