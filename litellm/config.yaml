# LiteLLM config — Freya model router
# Sits between Open WebUI and Ollama
# Exposes named model endpoints via OpenAI-compatible API at port 4000

model_list:

  # Primary conversational model — Freya's main voice/chat model
  - model_name: freya-main
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434

  # Deep reasoning model — used for complex analysis, research synthesis
  - model_name: freya-reasoning
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434

  # Fast lightweight model — quick lookups, simple commands
  - model_name: freya-fast
    litellm_params:
      model: ollama/phi3.5:3.8b
      api_base: http://ollama:11434

  # Vision model — camera feeds, plant health, image analysis
  - model_name: freya-vision
    litellm_params:
      model: ollama/llava:13b
      api_base: http://ollama:11434

  # Embeddings — used by Open WebUI RAG
  - model_name: freya-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true          # Drop unsupported params silently
  set_verbose: false

general_settings:
  master_key: freya-litellm-key   # Must match OPENAI_API_KEY in Open WebUI
