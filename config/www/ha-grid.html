<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBIVAN // COMMAND GRID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<header id="header">
  <div id="header-left">
    <div id="logo">FBIVAN <span>// COMMAND GRID</span></div>
    <div id="clock">--:--:-- ------</div>
  </div>
  <div id="status-dots" aria-label="System status"></div>
</header>

<div id="corner-tl"></div>
<div id="corner-tr"></div>
<div id="corner-bl"></div>
<div id="corner-br"></div>

<main id="grid" aria-label="Command grid"></main>

<script>
  window.HA_GRID_CACHE_BUST = Date.now().toString();

  const style = document.createElement("link");
  style.rel = "stylesheet";
  style.href = `./ha-grid/styles.css?v=${window.HA_GRID_CACHE_BUST}`;
  document.head.append(style);

  const app = document.createElement("script");
  app.type = "module";
  app.src = `./ha-grid/app.js?v=${window.HA_GRID_CACHE_BUST}`;
  document.body.append(app);
</script>
</body>
</html>
