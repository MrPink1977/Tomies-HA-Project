<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FBIVAN // LAUNCHING...</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080a0c;
    color: #ff9500;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    flex-direction: column;
    gap: 24px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 8px;
    text-shadow: 0 0 20px rgba(255,149,0,0.5);
  }
  .sub {
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,149,0,0.5);
  }
  .ring {
    width: 48px; height: 48px;
    border: 2px solid rgba(255,149,0,0.2);
    border-top-color: #ff9500;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,149,0,0.4);
  }
</style>
</head>
<body>
<h1>FBIVAN</h1>
<div class="sub">// COMMAND GRID //</div>
<div class="ring"></div>
<div class="status" id="status">CHECKING AUTH...</div>

<script>
  const GRID_URL  = 'http://localhost:8123/local/ha-grid.html';
  const HA_URL    = 'http://localhost:8123';
  const TOKEN     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjNjQ2ODE1Mzg0YzQ0M2YzOWM4ZTFiNzFhMGRkMzMzYiIsImlhdCI6MTc3NjYxODgzMCwiZXhwIjoyMDkxOTc4ODMwfQ.KOvJDa2kJVPI8HAmysYcRkU83AkyeFRy64SeiddQUd4';

  const status = document.getElementById('status');

  async function checkAuth() {
    status.textContent = 'VERIFYING SESSION...';
    try {
      const res = await fetch(`${HA_URL}/api/`, {
        headers: { 'Authorization': `Bearer ${TOKEN}` }
      });
      if (res.ok) {
        status.textContent = 'AUTH OK // LAUNCHING GRID...';
        setTimeout(() => { window.location.href = GRID_URL; }, 600);
      } else {
        goLogin();
      }
    } catch(e) {
      // HA might not be up yet — retry in 3s
      status.textContent = 'WAITING FOR HA...';
      setTimeout(checkAuth, 3000);
    }
  }

  function goLogin() {
    status.textContent = 'REDIRECTING TO LOGIN...';
    // After login HA redirects back to wherever, so we store grid as destination
    sessionStorage.setItem('ha_grid_redirect', GRID_URL);
    window.location.href = `${HA_URL}/?redirect_uri=${encodeURIComponent(GRID_URL)}`;
  }

  checkAuth();
</script>
</body>
</html>
