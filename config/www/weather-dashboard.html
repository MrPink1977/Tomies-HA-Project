<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEATHER // FREYA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c0e;--bg2:#0f1215;--bg3:#151a1e;--border:#1e2830;
  --amber:#e8890c;--amber2:#f5a623;--green2:#00ff88;--red:#e74c3c;
  --blue:#3498db;--cyan:#00d4ff;--text:#c8d8e8;--text2:#6a8090;
  --text3:#3a5060;--warn:#ff6b35;--rain:#4a9eff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:9999;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.pill{position:fixed;top:4px;right:6px;display:flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--border);background:rgba(15,18,21,0.85);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;z-index:50;}
.sdot{width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.grid{flex:1;overflow:hidden;display:grid;grid-template-columns:150px 1fr;grid-template-rows:1fr 52px;gap:3px;padding:3px;padding-top:4px;min-height:0;}
.card-current{grid-column:1;grid-row:1/3;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--cyan);padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-height:0;}
.card-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--cyan);letter-spacing:3px;margin-bottom:1px;}
.cur-temp{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--text);letter-spacing:2px;}
.cur-temp span{font-size:18px;color:var(--text2);}
.cur-desc{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:var(--cyan);margin-top:-4px;}
.cur-feels{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text2);letter-spacing:1px;}
.cur-icon{font-size:26px;line-height:1;margin:1px 0;}
.cur-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:2px;}
.stat-box{background:var(--bg3);border:1px solid var(--border);padding:5px 8px;}
.stat-lbl{font-family:'Share Tech Mono',monospace;font-size:7px;color:#2a7090;letter-spacing:2px;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--cyan);letter-spacing:1px;}
.stat-val span{font-size:10px;color:var(--text2);}
.sun-row{display:flex;gap:5px;}
.sun-box{flex:1;background:var(--bg3);border:1px solid var(--border);padding:5px 8px;}
.sun-lbl{font-family:'Share Tech Mono',monospace;font-size:7px;color:#2a7090;letter-spacing:2px;}
.sun-val{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--amber);letter-spacing:1px;}
.card-hourly{grid-column:2;grid-row:1;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--amber);padding:8px 10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.hourly-scroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;flex:1;align-items:center;}
.hourly-scroll::-webkit-scrollbar{height:3px;}
.hourly-scroll::-webkit-scrollbar-track{background:var(--border);}
.hourly-scroll::-webkit-scrollbar-thumb{background:var(--amber);}
.hour-item{flex-shrink:0;background:var(--bg3);border:1px solid var(--border);padding:5px 7px;text-align:center;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.hour-item.now{border-color:var(--cyan);background:rgba(0,212,255,0.05);}
.hour-time{font-family:'Share Tech Mono',monospace;font-size:8px;color:#3a90b0;letter-spacing:1px;}
.hour-icon{font-size:14px;}
.hour-rain{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--rain);}
.hour-temp{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--cyan);}
.card-bottom{grid-column:2;grid-row:2;background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--cyan);padding:4px 8px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:center;flex-shrink:0;}
.bot-box{text-align:center;}
.bot-lbl{font-family:'Share Tech Mono',monospace;font-size:7px;color:#2a7090;letter-spacing:2px;margin-bottom:2px;}
.bot-val{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--cyan);}
.bot-val span{font-size:10px;color:var(--text2);}
.rbar{height:2px;background:var(--border);position:fixed;bottom:0;left:0;right:0;z-index:200;}
.rfill{height:100%;background:var(--cyan);width:0%;transition:width linear;}
.loading{display:flex;align-items:center;justify-content:center;height:100%;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text2);letter-spacing:3px;}
</style>
</head>
<body>
<div class="shell">
  <!-- status pill only -->
  <div class="pill"><div class="sdot" id="sdot" style="background:var(--text3)"></div><span id="slabel">LOADING</span></div>
  <div class="grid" id="main-grid">
    <div class="loading" id="loading-msg">FETCHING WEATHER DATA...</div>
  </div>
</div>
<div class="rbar"><div class="rfill" id="rfill"></div></div>
<script>
const LAT=37.9756,LON=-91.5754,POLL=10*60*1000;
function wIcon(c,d=true){if(c===0)return d?'&#9728;&#65039;':'&#127769;';if(c<=2)return d?'&#9925;':'&#127780;&#65039;';if(c===3)return '&#9729;&#65039;';if(c<=49)return '&#127787;&#65039;';if(c<=67)return '&#127783;&#65039;';if(c<=77)return '&#10052;&#65039;';if(c<=82)return '&#127782;&#65039;';if(c<=86)return '&#127784;&#65039;';if(c>=95)return '&#9928;&#65039;';return '&#127777;&#65039;';}
function wDesc(c){const m={0:'CLEAR SKY',1:'MAINLY CLEAR',2:'PARTLY CLOUDY',3:'OVERCAST',45:'FOGGY',48:'ICE FOG',51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',77:'SNOW GRAINS',80:'LIGHT SHOWERS',81:'SHOWERS',82:'HEAVY SHOWERS',85:'SNOW SHOWERS',86:'HEAVY SNOW SHOWERS',95:'THUNDERSTORM',96:'THUNDERSTORM+HAIL',99:'HEAVY THUNDERSTORM'};return m[c]||'UNKNOWN';}
function windDir(d){const a=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return a[Math.round(d/22.5)%16];}
function fmtTime(iso){const d=new Date(iso);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function fmtHour(iso){const d=new Date(iso),h=d.getHours();if(h===0)return'12AM';if(h<12)return h+'AM';if(h===12)return'12PM';return(h-12)+'PM';}
function isDay(){const h=new Date().getHours();return h>=6&&h<20;}
function uvLabel(u){if(!u)return'--';if(u<3)return'LOW';if(u<6)return'MOD';if(u<8)return'HIGH';if(u<11)return'V.HIGH';return'EXTREME';}
function startBar(ms){const f=document.getElementById('rfill');f.style.transition='none';f.style.width='0%';setTimeout(()=>{f.style.transition=`width ${ms}ms linear`;f.style.width='100%';},50);}
async function fetchWeather(){const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure,visibility&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max,precipitation_sum&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=10`;const r=await fetch(url);return r.json();}
function render(d){
  const c=d.current,day=d.daily,hr=d.hourly,now=new Date();
  const ci=hr.time.findIndex(t=>new Date(t)>=now),si=Math.max(0,ci-1);
  document.getElementById('main-grid').innerHTML=`
  <div class="card-current">
    <div>
      <div class="card-lbl">CURRENT CONDITIONS</div>
      <div class="cur-icon">${wIcon(c.weather_code,isDay())}</div>
      <div class="cur-temp">${Math.round(c.temperature_2m)}<span>&#176;F</span></div>
      <div class="cur-desc">${wDesc(c.weather_code)}</div>
      <div class="cur-feels">FEELS LIKE ${Math.round(c.apparent_temperature)}&#176;F</div>
    </div>
    <div class="cur-stats">
      <div class="stat-box"><div class="stat-lbl">HUMIDITY</div><div class="stat-val">${c.relative_humidity_2m}<span>%</span></div></div>
      <div class="stat-box"><div class="stat-lbl">WIND</div><div class="stat-val">${Math.round(c.wind_speed_10m)}<span>mph</span></div></div>
      <div class="stat-box"><div class="stat-lbl">GUSTS</div><div class="stat-val">${Math.round(c.wind_gusts_10m)}<span>mph</span></div></div>
      <div class="stat-box"><div class="stat-lbl">DIR</div><div class="stat-val">${windDir(c.wind_direction_10m)}</div></div>
    </div>
    <div class="sun-row">
      <div class="sun-box"><div class="sun-lbl">RISE</div><div class="sun-val">${fmtTime(day.sunrise[0])}</div></div>
      <div class="sun-box"><div class="sun-lbl">SET</div><div class="sun-val">${fmtTime(day.sunset[0])}</div></div>
    </div>
  </div>
  <div class="card-hourly">
    <div class="card-lbl" style="margin-bottom:5px">HOURLY FORECAST</div>
    <div class="hourly-scroll">
      ${hr.time.slice(si,si+24).map((t,i)=>{const idx=si+i,isN=i===(ci-si),rain=hr.precipitation_probability[idx]||0;return`<div class="hour-item${isN?' now':''}"><div class="hour-time">${isN?'NOW':fmtHour(t)}</div><div class="hour-icon">${wIcon(hr.weather_code[idx],true)}</div>${rain>0?`<div class="hour-rain">${rain}%</div>`:'<div class="hour-rain" style="opacity:0">0%</div>'}<div class="hour-temp">${Math.round(hr.temperature_2m[idx])}&#176;</div></div>`;}).join('')}
    </div>
  </div>
  <div class="card-bottom">
    <div class="bot-box"><div class="bot-lbl">TODAY HIGH</div><div class="bot-val">${Math.round(day.temperature_2m_max[0])}<span>&#176;F</span></div></div>
    <div class="bot-box"><div class="bot-lbl">TODAY LOW</div><div class="bot-val">${Math.round(day.temperature_2m_min[0])}<span>&#176;F</span></div></div>
    <div class="bot-box"><div class="bot-lbl">RAIN CHANCE</div><div class="bot-val">${day.precipitation_probability_max[0]}<span>%</span></div></div>
    <div class="bot-box"><div class="bot-lbl">UV INDEX</div><div class="bot-val">${day.uv_index_max[0]?.toFixed(0)??'--'}<span> ${uvLabel(day.uv_index_max[0])}</span></div></div>
    <div class="bot-box"><div class="bot-lbl">VISIBILITY</div><div class="bot-val">${c.visibility?(c.visibility/1609).toFixed(1):'--'}<span>mi</span></div></div>
  </div>`;
  document.getElementById('sdot').style.background='var(--green2)';
  document.getElementById('slabel').textContent='LIVE DATA';
}
async function poll(){startBar(POLL);try{const data=await fetchWeather();render(data);}catch(e){document.getElementById('sdot').style.background='var(--red)';document.getElementById('slabel').textContent='ERROR';console.error(e);}}
poll();setInterval(poll,POLL);
</script>
</body>
</html>
