    - we're done
    - we are done
    - bye
    - goodbye
    - good night
    - goodnight
    - talk to you later
    - never mind
    - nevermind
    - forget it
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.freya_convo_active
  - action: input_number.set_value
    target:
      entity_id: input_number.freya_follow_up_count
    data:
      value: 0
  - action: assist_satellite.announce
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
