- id: voice_add_all_day_calendar_event
  alias: Voice - Add all-day calendar event
  description: Adds a spoken all-day event to the 2026 calendar.
  triggers:
    - trigger: conversation
      command:
        - "add {event_name} to the calendar for {month} {day}"
        - "add {event_name} to my calendar for {month} {day}"
        - "put {event_name} on the calendar for {month} {day}"
        - "schedule {event_name} for {month} {day}"
  conditions: []
  actions:
    - variables:
        raw_month: "{{ trigger.slots.month | lower }}"
        raw_day: "{{ trigger.slots.day | lower }}"
        event_title: "{{ trigger.slots.event_name }}"

        month_num: >
          {% set m = raw_month %}
          {% if m in ['january','jan'] %}01
          {% elif m in ['february','feb'] %}02
          {% elif m in ['march','mar'] %}03
          {% elif m in ['april','apr'] %}04
          {% elif m in ['may'] %}05
          {% elif m in ['june','jun'] %}06
          {% elif m in ['july','jul'] %}07
          {% elif m in ['august','aug'] %}08
          {% elif m in ['september','sept','sep'] %}09
          {% elif m in ['october','oct'] %}10
          {% elif m in ['november','nov'] %}11
          {% elif m in ['december','dec'] %}12
          {% else %}00
          {% endif %}

        day_num: >
          {% set d = raw_day %}
          {% if d in ['first','one','1','1st'] %}01
          {% elif d in ['second','two','2','2nd'] %}02
          {% elif d in ['third','three','3','3rd'] %}03
          {% elif d in ['fourth','four','4','4th'] %}04
          {% elif d in ['fifth','five','5','5th'] %}05
          {% elif d in ['sixth','six','6','6th'] %}06
          {% elif d in ['seventh','seven','7','7th'] %}07
          {% elif d in ['eighth','eight','8','8th'] %}08
          {% elif d in ['ninth','nine','9','9th'] %}09
          {% elif d in ['tenth','ten','10','10th'] %}10
          {% elif d in ['eleventh','eleven','11','11th'] %}11
          {% elif d in ['twelfth','twelve','12','12th'] %}12
          {% elif d in ['thirteenth','thirteen','13','13th'] %}13
          {% elif d in ['fourteenth','fourteen','14','14th'] %}14
          {% elif d in ['fifteenth','fifteen','15','15th'] %}15
          {% elif d in ['sixteenth','sixteen','16','16th'] %}16
          {% elif d in ['seventeenth','seventeen','17','17th'] %}17
          {% elif d in ['eighteenth','eighteen','18','18th'] %}18
          {% elif d in ['nineteenth','nineteen','19','19th'] %}19
          {% elif d in ['twentieth','twenty','20','20th'] %}20
          {% elif d in ['twenty first','twenty-first','21','21st'] %}21
          {% elif d in ['twenty second','twenty-second','22','22nd'] %}22
          {% elif d in ['twenty third','twenty-third','23','23rd'] %}23
          {% elif d in ['twenty fourth','twenty-fourth','24','24th'] %}24
          {% elif d in ['twenty fifth','twenty-fifth','25','25th'] %}25
          {% elif d in ['twenty sixth','twenty-sixth','26','26th'] %}26
          {% elif d in ['twenty seventh','twenty-seventh','27','27th'] %}27
          {% elif d in ['twenty eighth','twenty-eighth','28','28th'] %}28
          {% elif d in ['twenty ninth','twenty-ninth','29','29th'] %}29
          {% elif d in ['thirtieth','thirty','30','30th'] %}30
          {% elif d in ['thirty first','thirty-first','31','31st'] %}31
          {% else %}00
          {% endif %}

        start_day: "{{ '2026-' ~ month_num ~ '-' ~ day_num }}"
        end_day: >
          {{ (strptime('2026-' ~ month_num ~ '-' ~ day_num, '%Y-%m-%d') + timedelta(days=1)).strftime('%Y-%m-%d') }}

    - action: calendar.create_event
      target:
        entity_id: calendar.2026
      data:
        summary: "{{ event_title }}"
        start_date: "{{ start_day }}"
        end_date: "{{ end_day }}"

    - set_conversation_response: >
        Added {{ event_title }} to your calendar for {{ raw_month }} {{ raw_day }}.
  mode: queued
  max: 5
