- id: '1773370000002'
  alias: Freya - Add to Grocery List
  description: Voice command to add an item to the shopping list
  triggers:
  - trigger: conversation
    command:
    - add {item} to the grocery list
    - add {item} to my grocery list
    - add {item} to the shopping list
    - add {item} to my shopping list
    - put {item} on the grocery list
    - put {item} on my grocery list
    - put {item} on the shopping list
    - I need {item}
    - we need {item}
    - pick up {item}
    - get {item} from the store
  conditions: []
  actions:
  - alias: Add item to shopping list
    action: todo.add_item
    data:
      item: '{{ trigger.slots.item }}'
    target:
      entity_id: todo.grocery_list
  - alias: Freya confirms
    action: assist_satellite.announce
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      preannounce: false
      message: "{{ [\n  trigger.slots.item ~ \" added to the grocery list.\",\n  \"Got
        it. \" ~ trigger.slots.item ~ \" is on the list.\",\n  \"Added \" ~ trigger.slots.item
        ~ \" to the grocery list.\",\n  trigger.slots.item ~ \" — on the list.\"\n]
        | random }}"
  mode: single
- id: '1773370000003'
  alias: Freya - Read Grocery List
  description: Reads back the current grocery list
  triggers:
  - trigger: conversation
    command:
    - what's on the grocery list
    - what is on the grocery list
    - read me the grocery list
    - read the grocery list
    - what do we need from the store
    - what do I need from the store
    - read my grocery list
    - grocery list
    - shopping list
  conditions: []
  actions:
  - alias: Get list items
    action: todo.get_items
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: list_items
  - alias: Freya reads the list
    action: assist_satellite.announce
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      preannounce: false
      message: '{% set items = list_items[''todo.shopping_list''][''items''] %} {%
        if items | count == 0 %} Your grocery list is empty. {% elif items | count
        == 1 %} You have one item on the list: {{ items[0].summary }}. {% else %}
        You have {{ items | count }} items on the grocery list: {% for item in items
        %}{{ item.summary }}{% if not loop.last %}, {% endif %}{% endfor %}. {% endif
        %}'
  mode: single
- id: '1773380000001'
  alias: Freya - Conversation Mode Engine
  description: 'Arms on first response, keeps conversation alive after each reply,
    times out after 7s silence, hard-resets at 6 turns.

    '
  triggers:
  - trigger: state
    entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    from: responding
    to: idle
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.freya_convo_active
      state: 'on'
    - condition: numeric_state
      entity_id: input_number.freya_follow_up_count
      below: 1
  actions:
  - if:
    - condition: numeric_state
      entity_id: input_number.freya_follow_up_count
      above: 5
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.freya_convo_active
    - action: input_number.set_value
      target:
        entity_id: input_number.freya_follow_up_count
      data:
        value: 0
    - stop: Hit follow-up cap — conversation closed
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.freya_convo_active
  - action: input_number.set_value
    target:
      entity_id: input_number.freya_follow_up_count
    data:
      value: '{{ (states(''input_number.freya_follow_up_count'') | int) + 1 }}'
  - delay:
      seconds: 1
  - condition: state
    entity_id: input_boolean.freya_convo_active
    state: 'on'
  - action: assist_satellite.start_conversation
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      start_listening: true
  - wait_for_trigger:
    - trigger: state
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
      to: processing
    - trigger: state
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
      to: responding
    timeout:
      seconds: 7
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.freya_convo_active
    - action: input_number.set_value
      target:
        entity_id: input_number.freya_follow_up_count
      data:
        value: 0
  mode: single
  max_exceeded: silent
- id: '1773380000002'
  alias: Freya - Conversation Mode Close
  description: Handles closing phrases and disarms conversation mode
  triggers:
  - trigger: conversation
    command:
    - ok thanks
    - okay thanks
    - thanks
    - thank you
    - that's all
    - that is all
    - that's it
    - that is it
    - I'm done
    - I am done
    - we're done
    - we are done
    - bye
    - goodbye
    - good night
    - goodnight
    - talk to you later
    - never mind
    - nevermind
    - forget it
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.freya_convo_active
  - action: input_number.set_value
    target:
      entity_id: input_number.freya_follow_up_count
    data:
      value: 0
  - action: assist_satellite.announce
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      preannounce: false
      message: "{{ [\n  \"Anytime.\",\n  \"You got it.\",\n  \"No problem.\",\n  \"Talk
        to you later.\",\n  \"Alright, going quiet.\",\n  \"Standing by.\",\n  \"I'll
        be here.\"\n] | random }}"
  mode: single
