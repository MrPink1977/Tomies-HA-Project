- id: freya_research_voice_trigger
  alias: Freya Research Voice Trigger
  triggers:
  - trigger: conversation
    command:
    - give me a report on {query}
    - give me a detailed report on {query}
    - give me a quick report on {query}
    - make me a report on {query}
    - I need a report on {query}
    - create a report on {query}
    - write a report on {query}
    - run a report on {query}
    - deep dive on {query}
  conditions: []
  actions:
  - action: script.freya_research_report
    data:
      query: '{{ trigger.slots.query }}'
      title: '{{ trigger.slots.query }}'
      iterations: '{% if ''quick'' in trigger.sentence %}1 {% elif ''detailed'' in
        trigger.sentence or ''deep'' in trigger.sentence %}5 {% else %}3{% endif %}'
  - action: tts.speak
    target:
      entity_id: tts.elevenlabs_text_to_speech
    data:
      media_player_entity_id: media_player.home_assistant_voice_0a52fa_media_player
      cache: false
      message: Got it. Researching {{ trigger.slots.query }}. I'll let you know when
        your report is ready.
  mode: single
