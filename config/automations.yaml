- id: '1773380000001'
  alias: Freya - Conversation Mode Engine
  description: Arms on first response, keeps conversation alive after each reply,
    times out after 7s silence, hard-resets at 6 turns.
  triggers:
  - trigger: state
    entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    from: responding
    to: idle
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.freya_convo_active
      state: 'on'
    - condition: numeric_state
      entity_id: input_number.freya_follow_up_count
      below: 1
  actions:
  - if:
    - condition: numeric_state
      entity_id: input_number.freya_follow_up_count
      above: 5
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.freya_convo_active
    - action: input_number.set_value
      target:
        entity_id: input_number.freya_follow_up_count
      data:
        value: 0
    - stop: Hit follow-up cap — conversation closed
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.freya_convo_active
  - action: input_number.set_value
    target:
      entity_id: input_number.freya_follow_up_count
    data:
      value: '{{ (states(''input_number.freya_follow_up_count'') | int) + 1 }}'
  - delay:
      seconds: 1
  - condition: state
    entity_id: input_boolean.freya_convo_active
    state: 'on'
  - action: assist_satellite.start_conversation
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      start_listening: true
  - wait_for_trigger:
    - trigger: state
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
      to: processing
    - trigger: state
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
      to: responding
    timeout:
      seconds: 7
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.completed == false }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.freya_convo_active
    - action: input_number.set_value
      target:
        entity_id: input_number.freya_follow_up_count
      data:
        value: 0
  mode: single
  max_exceeded: silent
- id: '1773380000002'
