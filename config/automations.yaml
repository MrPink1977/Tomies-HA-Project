- id: '1773210283898'
  alias: Bedtime Mode - Voice Trigger
  description: Voice command triggers sleep mode
  triggers:
  - command:
    - run the bedtime lights
    - bedtime lights
    - bedtime mode
    - run bedtime mode
    - goodnight lights
    - time for bed
    trigger: conversation
  conditions: []
  actions:
  - alias: Set big lamps to dim warm
    target:
      entity_id:
      - light.biglamp1
      - light.biglamp2
    data:
      brightness_pct: 3
      color_temp_kelvin: 2200
    action: light.turn_on
  - alias: Turn off remaining lights
    target:
      entity_id:
      - light.ceilingfanlight
      - light.counterlamp1
      - light.counterlamp2
    action: light.turn_off
