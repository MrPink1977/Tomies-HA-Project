    action: assist_satellite.announce
    target:
      entity_id: assist_satellite.home_assistant_voice_0a52fa_assist_satellite
    data:
      message: "{{ [\n  \"Alright Tomie, lights are down. Try not to doom scroll for
        three hours this time.\",\n  \"Bedtime mode activated. The internet will still
        be there tomorrow.\",\n  \"Lights dimmed. Get some sleep, you've earned it.\",\n
        \ \"Going dark. Don't make me come back on in twenty minutes.\",\n  \"Sleep
        mode engaged. Goodnight Tomie.\"\n] | random }}"
      preannounce: false
  - alias: Wait 1 hour then kill everything
    delay:
      hours: 1
  - alias: Turn off last lamps and TV after 1 hour
    target:
      entity_id:
      - light.biglamp2
      - light.biglamp1
    action: light.turn_off
    data: {}
  - target:
      entity_id: media_player.android_tv_192_168_0_128
    action: media_player.turn_off
  mode: single
