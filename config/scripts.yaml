close_table:
  sequence:
  - action: mqtt.publish
    data:
      qos: '0'
      topic: awesome_table/cmd
      payload: CLOSE
    alias: Close Table
  - action: mqtt.publish
    data:
      qos: '0'
      topic: awesome_table/cmd
      payload: OPEN
    alias: Open Table
  alias: Close Table
  description: ''
open_table:
  sequence:
  - action: mqtt.publish
    data:
      qos: '0'
      topic: awesome_table/cmd
      payload: OPEN
  alias: Open Table
  description: ''
stop_table:
  sequence:
  - action: mqtt.publish
    data:
      qos: '0'
      topic: awesome_table/cmd
      payload: STOP
    alias: stop Table
  alias: Stop Table
  description: ''
freya_research_report:
  alias: Freya Research Report
  mode: parallel
  max: 5
  fields:
    query:
      description: The research topic
      example: Meshtastic LoRa driveway sensor
      required: true
    title:
      description: Report title (optional)
      example: Meshtastic Research
      required: false
    iterations:
      description: 'Depth: 1=quick, 3=standard, 5=deep'
      example: 3
      required: false
  sequence:
  - action: rest_command.make_research_report
    data:
      query: '{{ query }}'
      title: '{{ title | default(query) }}'
      iterations: '{{ iterations | default(3) }}'
  - delay:
      seconds: 2
  - action: tts.speak
    target:
      entity_id: tts.elevenlabs_text_to_speech
    data:
      media_player_entity_id: media_player.home_assistant_voice_0a52fa_media_player
      cache: false
      message: Got it. I'll look into {{ title | default(query) }}. I'll let you know
        when your report is ready.
go_to_command_screen:
  alias: Go To Command Screen
  description: Switches the bedroom TV to HDMI 4 (HW4) and opens the FBIVAN command
    grid dashboard fullscreen
  sequence:
  - target:
      entity_id: media_player.android_tv_192_168_0_128
    action: media_player.turn_on
  - delay:
      seconds: 3
  - target:
      entity_id: media_player.android_tv_192_168_0_128
    data:
      source: HW4
    action: media_player.select_source
  - data:
      topic: homeassistant/button/FBIVAN/command_screen/action
      payload: 'ON'
    action: mqtt.publish
  mode: single
  icon: mdi:monitor-dashboard
