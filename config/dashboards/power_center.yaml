title: Kiosk
button_card_templates:
  base_tile:
    show_icon: false
    show_name: true
    show_state: true
    styles:
      card:
        - border-radius: 14px
        - padding: 14px
        - background: rgba(0,0,0,0.55)
        - border: 1px solid rgba(255,255,255,0.10)
        - box-shadow: 0 6px 22px rgba(0,0,0,0.35)
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
        - letter-spacing: 0.3px
      state:
        - justify-self: start
        - font-size: 20px
        - font-weight: 800
        - margin-top: 2px
      grid:
        - grid-template-areas: '"n n" "s s" "meta meta"'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto auto auto
  power_color:
    styles:
      card:
        - background: |
            [[[
              const w = Number(entity.state || 0);
              if (w >= 1500) return 'rgba(255, 59, 59, 0.18)';
              if (w >= 700)  return 'rgba(255, 191, 32, 0.16)';
              if (w >= 80)   return 'rgba(0, 255, 180, 0.12)';
              return 'rgba(0, 0, 0, 0.55)';
            ]]]
        - border: |
            [[[
              const w = Number(entity.state || 0);
              if (w >= 1500) return '1px solid rgba(255, 59, 59, 0.40)';
              if (w >= 700)  return '1px solid rgba(255, 191, 32, 0.35)';
              if (w >= 80)   return '1px solid rgba(0, 255, 180, 0.28)';
              return '1px solid rgba(255,255,255,0.10)';
            ]]]
        - box-shadow: |
            [[[
              const w = Number(entity.state || 0);
              if (w >= 1500) return '0 10px 26px rgba(255, 59, 59, 0.18)';
              if (w >= 700)  return '0 10px 26px rgba(255, 191, 32, 0.16)';
              if (w >= 80)   return '0 10px 26px rgba(0, 255, 180, 0.12)';
              return '0 6px 22px rgba(0,0,0,0.35)';
            ]]]
  breaker_tile:
    template:
      - base_tile
      - power_color
    custom_fields:
      meta: |
        [[[
          const v = states[variables.voltage_entity]?.state;
          const a = states[variables.current_entity]?.state;
          const vv = (v !== undefined && v !== 'unknown' && v !== 'unavailable') ? `${Number(v).toFixed(0)}V` : '--V';
          const aa = (a !== undefined && a !== 'unknown' && a !== 'unavailable') ? `${Number(a).toFixed(1)}A` : '--A';
          return `${vv}  •  ${aa}`;
        ]]]
    styles:
      custom_fields:
        meta:
          - justify-self: start
          - font-size: 12px
          - opacity: 0.85
          - margin-top: 6px
  leg_tile:
    template:
      - base_tile
      - power_color
    styles:
      name:
        - font-size: 13px
        - opacity: 0.9
      state:
        - font-size: 26px

views:
  - title: Power Center
    path: power
    icon: mdi:transmission-tower
    type: panel
    cards:
      - type: vertical-stack
        cards:

          # ── LEG TOTALS ──────────────────────────────────────────
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: leg_tile
                name: LEG A (SEM C) — Odd Breakers
                entity: sensor.sem_c_active_power
              - type: custom:button-card
                template: leg_tile
                name: LEG B (SEM B) — Even Breakers
                entity: sensor.sem_b_active_power

          # ── BREAKER GRID — matches physical panel layout ─────────
          # Left column = odd breakers (Leg A / SEM C)
          # Right column = even breakers (Leg B / SEM B)
          - type: grid
            columns: 2
            square: false
            cards:

              # B1 odd / CH16 — Garage Heater 240V pole 1
              - type: custom:button-card
                template: breaker_tile
                name: "B1  •  CH16 — Garage Heater (240V)"
                entity: sensor.sem_ch16_garage_heater_3_active_power
                variables:
                  voltage_entity: sensor.sem_ch16_garage_heater_3_voltage
                  current_entity: sensor.sem_ch16_garage_heater_3_current

              # B2 even / CH01 — Bedroom Minisplit single pole
              - type: custom:button-card
                template: breaker_tile
                name: "B2  •  CH01 — Bedroom Minisplit"
